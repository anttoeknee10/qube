format:
  html:
    theme:
      - cosmo
    css: styles/styles.css
    toc: false
    page-layout: full
    include-after-body:
      - text: |
          <script>
          document.addEventListener("DOMContentLoaded", function () {
            const progToggle = document.getElementById("nav-menu-programs");
            if (progToggle) {
              const overviewItem = progToggle.parentElement.querySelector(".dropdown-menu a.dropdown-item");
              if (overviewItem) {
                const overviewHref = overviewItem.getAttribute("href");
                progToggle.setAttribute("href", overviewHref);
                progToggle.removeAttribute("data-bs-toggle");
                progToggle.addEventListener("click", function (e) {
                  window.location.href = overviewHref;
                });
              }
            }
          });
          </script>
